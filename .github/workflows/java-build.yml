name: Java Build and Unit Tests

on:
  push:
    branches: [main, "debug/**"]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Java 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Compile application and all test sources
        run: mvn --batch-mode --no-transfer-progress test-compile

      - name: Run database-independent unit tests
        run: >
          mvn --batch-mode --no-transfer-progress
          -Dtest=OwnershipSecurityTest,PasswordPolicyTest,PasswordServiceTest,IdentityMatchServiceTest,OAuthStateSecurityTest,PkceSecurityTest,OAuthStateStoreTest,PkceUtilTest,PatientServiceAccessTest
          test
